# Spring test 属性 —— 仅测试 classpath 生效。
#
# 开启测试类构造器注入：JUnit 默认不把构造器参数交给 SpringExtension 解析，
# 必须显式开启 autowire=all。框架 ArchUnit 守护 `noFieldInjection` 禁止 @Autowired 字段注入
# （生产 + 测试代码一视同仁），故测试类统一走构造器注入以满足该守护。
# 参考：org.springframework.test.context.TestConstructor。
spring.test.constructor.autowire.mode=all
