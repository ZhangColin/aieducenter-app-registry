server:
  port: 8088

spring:
  application:
    name: aieducenter-app-registry
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
    table: aieducenter-openapi_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

# OpenAPI 签名配置
cartisan:
  openapi:
    sign:
      enabled: true
      app-id: ${OPENAPI_APP_ID:}
      app-secret: ${OPENAPI_APP_SECRET:}
      apikey-service-url: https://openapi.aieducenter.com/api/v1/api-keys/by-appId

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
